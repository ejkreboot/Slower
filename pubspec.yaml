name: slower
description: "Slow down audio to help learning and trasnscription."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  window_size: ^0.1.0
  file_picker: ^10.1.2
  wav: ^1.4.0
  just_audio: ^0.9.20
  path: ^1.9.1
  path_provider: ^2.0.14
  
dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  image_path: "assets/icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
